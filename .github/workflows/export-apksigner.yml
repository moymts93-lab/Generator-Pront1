name: Export Android signing tools
on:
  push:
    branches: [ "kazna-apk-05-build" ]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare tools
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p signer-tools/lib
          cp "$BT/apksigner" signer-tools/
          cp "$BT/zipalign" signer-tools/
          cp "$BT/lib/apksigner.jar" signer-tools/lib/
          chmod +x signer-tools/apksigner signer-tools/zipalign
          echo "Using $BT"
      - uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools-only
          path: signer-tools
          if-no-files-found: error
          retention-days: 1
