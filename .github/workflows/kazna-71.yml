name: Build Kazna 7.1 APK
on:
  push:
    branches: [ "kazna-71-build" ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Extract base source
        run: |
          mkdir -p kazna
          cat kazna-src-parts/*.b64 | base64 -d > kazna-src-ci.tar.gz
          echo "cffe9d3b4a54daeafc5e110f94c255dda1f0a560fef98463ab0d017e66f5eb37  kazna-src-ci.tar.gz" | sha256sum -c -
          tar -xzf kazna-src-ci.tar.gz -C kazna
      - name: Apply Kazna 7.1 source
        run: |
          tar -xzf kazna71-overlay.tar.gz -C kazna
          grep -q "versionCode 71" kazna/app/build.gradle
          grep -q "versionName '7.1'" kazna/app/build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Patch manual APK builder for 7.1
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("kazna/build_apk.py")
          s=p.read_text()
          s=re.sub(r"BT=SDK/'build-tools/[^']+'", "BT=next((SDK/'build-tools'/v for v in ['35.0.1','35.0.0'] if (SDK/'build-tools'/v).is_dir()), SDK/'build-tools/35.0.0')", s)
          s=re.sub(r"'--version-code','[^']+','--version-name','[^']+'", "'--version-code','71','--version-name','7.1'", s)
          s=re.sub(r"apk=BUILD/'Kazna-[^']+\\.apk'", "apk=BUILD/'Kazna-7.1.apk'", s)
          p.write_text(s)
          PY
      - name: Build and sign Kazna 7.1 APK
        working-directory: kazna
        run: python3 build_apk.py
      - uses: actions/upload-artifact@v4
        with:
          name: Kazna-7.1
          path: kazna/build/local-apk/Kazna-7.1.apk
          if-no-files-found: error
          retention-days: 1
