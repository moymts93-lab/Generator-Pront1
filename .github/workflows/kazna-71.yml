name: Build Kazna 7.1 APK
on:
  push:
    branches: [ "kazna-71-build" ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Extract base source
        run: |
          mkdir -p kazna
          cat kazna-src-parts/*.b64 | base64 -d > kazna-src-ci.tar.gz
          echo "cffe9d3b4a54daeafc5e110f94c255dda1f0a560fef98463ab0d017e66f5eb37  kazna-src-ci.tar.gz" | sha256sum -c -
          tar -xzf kazna-src-ci.tar.gz -C kazna
      - name: Apply Kazna 7.1 source
        run: |
          tar -xzf kazna71-overlay.tar.gz -C kazna
          grep -q "versionCode 71" kazna/app/build.gradle
          grep -q "versionName '7.1'" kazna/app/build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build unsigned release APK
        working-directory: kazna
        run: gradle --no-daemon :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: kazna-7.1-unsigned
          path: kazna/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 1
