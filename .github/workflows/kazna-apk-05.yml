ank)&&!e.card.isEmpty())cards.add(e.card);return cards.size();}\n void bankFinanceCard(LinearLayout p,String bank){\n  Long value=bankBalance(bank);LinearLayout c=col();c.setPadding(dp(20),dp(18),dp(20),dp(18));c.setBackground(shape(INK,24));c.setFocusable(true);c.setClickable(true);\n  LinearLayout top=row();weight(top,text(bank.toUpperCase(new Locale("ru")),11,0xffbdcfc3,true));TextView arrow=text("›",24,0xffbdcfc3,true);top.addView(arrow);add(c,top);gap(c,10);\n  add(c,text(value==null?"Баланс не указан":rub(value),value==null?23:30,WHITE,true));gap(c,7);int cards=bankCardCount(bank);String meta=(cards==0?"Карты пока не определены":cards+" "+(cards==1?"карта":"карты"))+" · нажми для действий";add(c,text(meta,12,0xffbdcfc3,false));\n  c.setOnClickListener(v->bankMenu(bank));c.setContentDescription(bank+", "+(value==null?"баланс не указан":rub(value))+", открыть меню банка");add(p,c);gap(p,12);\n }\n void bankMenu(String bank){Long value=bankBalance(bank);String balanceAction=value==null?"Указать баланс":"Изменить баланс";new AlertDialog.Builder(this).setTitle(bank).setItems(new String[]{"Операции банка",balanceAction},(d,i)->{if(i==0){selectedBank=bank;selectedCard="";allTime=true;onlyReview=false;tab=1;render();}else editBalance(bank);}).show();}\n void editBalance(String bank){LinearLayout p=col();p.setPadding(dp(20),dp(8),dp(20),dp(8));Long current=bankBalance(bank);EditText amount=field(p,"Текущий баланс, ₽",current==null?"":java.math.BigDecimal.valueOf(current,2).toPlainString(),InputType.TYPE_CLASS_NUMBER|InputType.TYPE_NUMBER_FLAG_DECIMAL);hint(p,"Это общий баланс по картам "+bank+". Ручное значение имеет приоритет над балансом из новых уведомлений банка.");AlertDialog d=new AlertDialog.Builder(this).setTitle(bank).setView(p).setNegativeButton("Отмена",null).setNeutralButton(prefs.contains("balance_"+bank)?"Авто":"",null).setPositiveButton("Сохранить",null).create();d.setOnShowListener(x->{d.getButton(AlertDialog.BUTTON_POSITIVE).setOnClickListener(v->{try{String raw=amount.getText().toString().trim();if(!raw.matches("\\\\d+(?:[.,]\\\\d{1,2})?")){amount.setError("Например 12500,50");return;}long value=BankParser.money(raw);if(value<0||value>10000000000000L)throw new IllegalArgumentException();prefs.edit().putLong("balance_"+bank,value).apply();d.dismiss();render();}catch(Exception ex){amount.setError("Проверь сумму");}});if(prefs.contains("balance_"+bank))d.getButton(AlertDialog.BUTTON_NEUTRAL).setOnClickListener(v->{prefs.edit().remove("balance_"+bank).apply();d.dismiss();render();});});d.show();}\n'+s[b:]
