          old='static Row row(Entry e,String document,int line,String warning){Row r=new Row();e.key=BankParser.fingerprint("statement|"+e.bank+"|"+document+"|"+line);e.source="statement";e.review=e.type.equals("unknown")||e.category.equals("Другое")||e.type.startsWith("transfer");r.entry=e;r.number=line;r.warning=warning;r.selected=e.counted()&&warning.isEmpty();return r;}'
          new='static Row row(Entry e,String document,int line,String warning){Row r=new Row();e.key=BankParser.fingerprint("statement|"+e.bank+"|"+document+"|"+line);e.source="statement";e.review=e.type.equals("unknown")||e.type.startsWith("transfer");r.entry=e;r.number=line;r.warning=warning;r.selected=e.counted()&&warning.isEmpty()&&autoType(e.type);return r;}'
