          a=s.index(" public static Result text(")
          b=s.index(" public static void match(",a)
          s=s[:a]+r''' public static Result text(String text,String bank,String doc){
  Result out=new Result();String[] lines=text.replace('\u00a0',' ').split("\\r?\\n");int index=0;
  for(int li=0;li<lines.length;li++){index=li+1;String raw=norm(lines[li]);Matcher d=DATE.matcher(raw);if(!d.find())continue;
   if(out.rows.size()>=2000)throw new IllegalArgumentException("Не больше 2000 строк за импорт");
   try{
    if(summaryLine(raw)||balanceOnly(raw)){out.skipped++;continue;}
    String combined=raw;
    for(int j=li+1;j<Math.min(lines.length,li+4);j++){String next=norm(lines[j]);if(next.isEmpty())continue;if(DATE.matcher(next).find())break;if(summaryLine(next)||balanceOnly(next))continue;if(next.length()<=240)combined+=" "+next;}
    long time=date(d.group());Matcher cd=DATE.matcher(combined);cd.find();String rest=combined.substring(cd.end()).trim();
    Matcher second=DATE.matcher(rest);if(second.lookingAt())rest=rest.substring(second.end()).trim();
    if(summaryLine(rest)||balanceOnly(rest)||rest.toLowerCase(new Locale("ru")).matches(".*(задолженность|лимит).*")){out.skipped++;continue;}
    Entry e=new Entry();e.bank=bank;e.time=time;e.raw=combined.length()>6000?combined.substring(0,6000):combined;

    java.util.List<String> values=new ArrayList<>();java.util.List<Integer> starts=new ArrayList<>();java.util.List<Integer> ends=new ArrayList<>();
    Matcher money=SIGNED_RUB.matcher(rest);
    while(money.find()){values.add(money.group(1));starts.add(money.start());ends.add(money.end());}
    if(values.isEmpty()){int cutoff=balanceMarker(rest);money=MONEY.matcher(rest.substring(0,cutoff));while(money.find()){values.add(money.group(1));starts.add(money.start());ends.add(money.end());}}
    if(values.isEmpty()){out.skipped++;continue;}

    boolean same=true;long first=-1;
    for(String candidate:values){long parsed=amount(candidate);if(first<0)first=parsed;else if(parsed!=first)same=false;}
    int chosen=0;String warning="";
    if(values.size()>1&&!same)warning="Несколько разных сумм в строке — укажи сумму операции";
    String value=values.get(chosen);int ma=starts.get(chosen),mb=ends.get(chosen);
    e.amount=warning.isEmpty()?first:0;e.type=kind(rest,value);
    if(Pattern.compile("(?iu)(usd|eur|cny|kzt|[$€¥])").matcher(rest).find()){e.amount=0;e.type="unknown";warning="Валютная операция требует ручной проверки";}
    e.merchant=norm(rest.substring(0,ma)+" "+rest.substring(mb)).replaceAll("\\s+"," ");
    Matcher card=Pattern.compile("[*•]+\\s*(\\d{4})(?!\\d)").matcher(e.merchant);if(card.find())e.card=card.group(1);
    if(e.merchant.length()>200)e.merchant=e.merchant.substring(0,200);if(e.merchant.isEmpty())e.merchant="Операция из выписки";
    e.category=BankParser.category(e.merchant);
    if(e.type.equals("unknown"))warning=warning.isEmpty()?"Не удалось определить расход или поступление":warning;
    if(e.type.startsWith("transfer"))warning=warning.isEmpty()?"Проверь направление перевода":warning;
    Row r=row(e,doc,index,warning);out.rows.add(r);
   }catch(Exception ex){out.skipped++;}
  }
  out.note="Сбер/PDF: однозначные покупки, списания, поступления и возвраты выбраны автоматически. Остатки, итоги и категории выписки отбрасываются. Проверка нужна только для неоднозначных строк.";
  return out;
 }
'''+s[b:]
