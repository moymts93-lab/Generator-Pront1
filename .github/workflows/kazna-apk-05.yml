name: Build Kazna 0.7.3 APK
on:
  push:
    branches: [ "kazna-apk-05-build" ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Extract base source
        run: |
          mkdir -p kazna
          cat kazna-src-parts/*.b64 | base64 -d > kazna-src-ci.tar.gz
          echo "cffe9d3b4a54daeafc5e110f94c255dda1f0a560fef98463ab0d017e66f5eb37  kazna-src-ci.tar.gz" | sha256sum -c -
          tar -xzf kazna-src-ci.tar.gz -C kazna
          cp kazna/app/build.gradle /tmp/kazna-base-build.gradle
      - name: Apply verified 7.1 overlay
        run: |
          echo "83dce1a122e1ead5ad7e1634b8cb807c9801a38491e39cede60d40dfae76096d  kazna71-overlay.tar.gz" | sha256sum -c -
          tar -xzf kazna71-overlay.tar.gz -C kazna
          cp /tmp/kazna-base-build.gradle kazna/app/build.gradle
      - name: Apply 7.2 T-Bank and Alfa statement support
        run: |
          { cat kazna72-parts/00.b64; cat kazna72-parts/01.b64; head -c 15000 kazna72-parts/02.b64; cat kazna72-parts/03.b64; } | base64 -d > kazna72-overlay.tar.gz
          echo "b02843c3bb70ef05f13989e459f61336ef106b21defcdf6a182b7e029fe5aa2f  kazna72-overlay.tar.gz" | sha256sum -c -
          tar -xzf kazna72-overlay.tar.gz -C kazna
          sed -E -i "s/versionCode [0-9]+; versionName '[^']+'/versionCode 72; versionName '7.2'/" kazna/app/build.gradle
          grep "versionCode 72; versionName '7.2'" kazna/app/build.gradle
      - name: Apply 0.7.2 credit screenshot support
        run: |
          echo "99e9032a07d9dd47010f308c89f80ec148c66dd7bcdec5e34e2988a2069af6b7  kazna072-overlay.tar.gz" | sha256sum -c -
          tar -xzf kazna072-overlay.tar.gz -C kazna
          sed -E -i "s/versionCode [0-9]+; versionName '[^']+'/versionCode 72; versionName '0.7.2'/" kazna/app/build.gradle
          python3 -c "from pathlib import Path; p=Path('kazna/app/build.gradle'); s=p.read_text(); s=s.replace('dependencies {', \"dependencies { implementation 'com.google.mlkit:text-recognition:16.0.1';\", 1); p.write_text(s)"
          grep "versionCode 72; versionName '0.7.2'" kazna/app/build.gradle
          grep "text-recognition" kazna/app/build.gradle
          if grep -q '^android.useAndroidX=' kazna/gradle.properties; then sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' kazna/gradle.properties; else echo 'android.useAndroidX=true' >> kazna/gradle.properties; fi
          grep '^android.useAndroidX=true' kazna/gradle.properties
      - name: Apply 0.7.3 push/balance hotfix
        run: |
          echo "bd1cb87046140ee735d434206df1843d45c27920f9b5decd8fd047aeac859348  kazna073-hotfix.tar.gz" | sha256sum -c -
          tar -xzf kazna073-hotfix.tar.gz -C kazna
          sed -E -i "s/versionCode [0-9]+; versionName '[^']+'/versionCode 73; versionName '0.7.3'/" kazna/app/build.gradle
          grep "versionCode 73; versionName '0.7.3'" kazna/app/build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build unsigned release APK
        working-directory: kazna
        run: gradle --no-daemon :app:assembleRelease
      - name: Align release APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          IN=$(find kazna/app/build/outputs/apk/release -name '*-unsigned.apk' | head -1)
          "$BT/zipalign" -f -p 4 "$IN" kazna/app/build/outputs/apk/release/Kazna-0.7.3-aligned-unsigned.apk
          "$BT/zipalign" -c -p 4 kazna/app/build/outputs/apk/release/Kazna-0.7.3-aligned-unsigned.apk
      - name: Export signing tools
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p signer-tools/lib
          cp "$BT/apksigner" signer-tools/
          cp "$BT/zipalign" signer-tools/
          cp "$BT/lib/apksigner.jar" signer-tools/lib/
          chmod +x signer-tools/apksigner signer-tools/zipalign
      - uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools-073
          path: signer-tools
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: kazna-0.7.3-unsigned
          path: kazna/app/build/outputs/apk/release/Kazna-0.7.3-aligned-unsigned.apk
          if-no-files-found: error
          retention-days: 1
