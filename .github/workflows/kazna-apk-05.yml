name: Build Kazna 0.7.5 APK
on:
  push:
    branches: [ "kazna-apk-05-build" ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Extract Kazna 0.7.4 source
        run: |
          rm -rf kazna
          mkdir -p kazna
          echo "2fb16858cdae586e76820a2e8a28dbbfc9ae82c6894f73e29fe5aa7505f1fbcc  kazna074-full.tar.gz" | sha256sum -c -
          tar -xzf kazna074-full.tar.gz -C kazna
          grep "versionCode 74; versionName '0.7.4'" kazna/app/build.gradle
          grep '^android.useAndroidX=true' kazna/gradle.properties
      - name: Apply Kazna 0.7.5 changes
        run: |
          echo "f92efb51a98924173010690a39e71f13936f94371d0d96b5134b23b72adc6470  kazna075-overlay.tar.gz" | sha256sum -c -
          tar -xzf kazna075-overlay.tar.gz -C kazna
          grep "versionCode 75; versionName '0.7.5'" kazna/app/build.gradle
          python3 - <<'PY'
          from pathlib import Path
          p=Path("kazna/settings.gradle")
          s=p.read_text()
          if "jitpack.io" not in s:
              s=s.replace("repositories { google(); mavenCentral() }","repositories { google(); mavenCentral(); maven { url 'https://jitpack.io' } }")
          p.write_text(s)
          PY
          mkdir -p kazna/app/src/main/assets/tessdata
          curl -L --fail --retry 3 -o kazna/app/src/main/assets/tessdata/rus.traineddata https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/rus.traineddata
          curl -L --fail --retry 3 -o kazna/app/src/main/assets/tessdata/eng.traineddata https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/eng.traineddata
          test -s kazna/app/src/main/assets/tessdata/rus.traineddata
          test -s kazna/app/src/main/assets/tessdata/eng.traineddata
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release APK
        working-directory: kazna
        run: gradle --no-daemon :app:assembleRelease
      - name: Align release APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          IN=$(find kazna/app/build/outputs/apk/release -name '*-unsigned.apk' | head -1)
          "$BT/zipalign" -f -p 4 "$IN" kazna/app/build/outputs/apk/release/Kazna-0.7.5-aligned-unsigned.apk
          "$BT/zipalign" -c -p 4 kazna/app/build/outputs/apk/release/Kazna-0.7.5-aligned-unsigned.apk
      - name: Export signing tools
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p signer-tools/lib
          cp "$BT/apksigner" signer-tools/
          cp "$BT/lib/apksigner.jar" signer-tools/lib/
          chmod +x signer-tools/apksigner
      - uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools-075
          path: signer-tools
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: kazna-0.7.5-unsigned
          path: kazna/app/build/outputs/apk/release/Kazna-0.7.5-aligned-unsigned.apk
          if-no-files-found: error
          retention-days: 1
