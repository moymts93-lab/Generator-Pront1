name: Build Kazna 0.7.5 APK
on:
  push:
    branches: [ "kazna-apk-05-build" ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Extract Kazna 0.7.5 source
        run: |
          rm -rf kazna
          mkdir -p kazna
          echo "b71ba822ad83851c9c8d7c34bd25b44c7e6da5e9191916d45b8073fe2bcd9cbc  kazna075-full.tar.gz" | sha256sum -c -
          tar -xzf kazna075-full.tar.gz -C kazna
          grep "versionCode 75; versionName '0.7.5'" kazna/app/build.gradle
      - name: Add Russian OCR models
        run: |
          mkdir -p kazna/app/src/main/assets/tessdata
          curl -L --fail --retry 3 -o kazna/app/src/main/assets/tessdata/rus.traineddata https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/rus.traineddata
          curl -L --fail --retry 3 -o kazna/app/src/main/assets/tessdata/eng.traineddata https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/eng.traineddata
          test -s kazna/app/src/main/assets/tessdata/rus.traineddata
          test -s kazna/app/src/main/assets/tessdata/eng.traineddata
      - name: Apply credit parser Java 8 hotfix
        run: |
          echo "becf96534d2c963e02f5e366c400e57aa9855e9d51a78d8bd4134a2c7528dcbf  kazna075-credit-hotfix.tar.gz" | sha256sum -c -
          tar -xzf kazna075-credit-hotfix.tar.gz -C kazna
      - name: Fix Java 8 regex escapes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("kazna/app/src/main/java/ru/kazna/app/CreditScreenshotParser.java")
          s=p.read_text()
          s=re.sub(r'(?<!\\)\\s', r'\\\\s', s)
          p.write_text(s)
          PY
          grep -n "termMonths" kazna/app/src/main/java/ru/kazna/app/CreditScreenshotParser.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release APK
        working-directory: kazna
        run: gradle --no-daemon :app:assembleRelease
      - name: Align release APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          IN=$(find kazna/app/build/outputs/apk/release -name '*-unsigned.apk' | head -1)
          "$BT/zipalign" -f -p 4 "$IN" kazna/app/build/outputs/apk/release/Kazna-0.7.5-aligned-unsigned.apk
          "$BT/zipalign" -c -p 4 kazna/app/build/outputs/apk/release/Kazna-0.7.5-aligned-unsigned.apk
      - name: Export signing tools
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p signer-tools/lib
          cp "$BT/apksigner" signer-tools/
          cp "$BT/lib/apksigner.jar" signer-tools/lib/
          chmod +x signer-tools/apksigner
      - uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools-075
          path: signer-tools
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: kazna-0.7.5-unsigned
          path: kazna/app/build/outputs/apk/release/Kazna-0.7.5-aligned-unsigned.apk
          if-no-files-found: error
          retention-days: 1
