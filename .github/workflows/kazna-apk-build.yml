name: Kazna release tools
on:
  push:
    branches: [ kazna-apk-build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download source
        run: |
          curl -fL -o /tmp/kazna.zip "https://kazna-build-host-20260925.floot.app/_cdn/static/5a526e82-2cf9-4fb2-a369-efa1fbdb08f2-Kazna-0.7.8-source.zip"
          mkdir kazna-src
          unzip -q /tmp/kazna.zip -d kazna-src
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build unsigned release
        working-directory: kazna-src
        run: gradle --no-daemon --stacktrace assembleRelease
      - name: Collect release and signer
        run: |
          set -eux
          cp kazna-src/app/build/outputs/apk/release/app-release-unsigned.apk Kazna-0.7.8-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" apksigner-35.jar
          sha256sum Kazna-0.7.8-unsigned.apk apksigner-35.jar > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Kazna-0.7.8-release-tools
          path: |
            Kazna-0.7.8-unsigned.apk
            apksigner-35.jar
            SHA256SUMS.txt
